name: Cutover system suite
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  system:
    runs-on: ubuntu-latest
    environment: cutover-candidate
    env:
      GOPRIVATE: github.com/endless-net/*
      GONOSUMDB: github.com/endless-net/*
      ENDLESSNET_SYSTEM_API_URL: ${{ vars.ENDLESSNET_SYSTEM_API_URL }}
      ENDLESSNET_SYSTEM_NODE_ID: ${{ vars.ENDLESSNET_SYSTEM_NODE_ID }}
    defaults:
      run:
        working-directory: systemtests
    steps:
      - uses: actions/checkout@v7
      - name: Configure private modules
        env:
          MODULE_TOKEN: ${{ secrets.ENDLESSNET_MODULE_TOKEN }}
        run: |
          test -n "$MODULE_TOKEN"
          git config --global url."https://x-access-token:${MODULE_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/setup-go@v7
        with:
          go-version-file: systemtests/go.mod
          cache: false
      - run: go test -tags=system -count=1 ./...
