name: CI

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clientapi
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: clientapi/go.mod
      - name: Verify modules
        run: go mod verify
      - name: Verify dependency licenses
        run: ../scripts/check-licenses.sh .
      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || {
            printf '%s\n' "$unformatted"
            exit 1
          }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -short ./...
  clientapi-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clientapi/v2
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: clientapi/v2/go.mod
      - name: Verify modules
        run: go mod verify
      - name: Verify dependency licenses
        run: ../../scripts/check-licenses.sh .
      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || {
            printf '%s\n' "$unformatted"
            exit 1
          }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -short ./...
  browser-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: contracts/go.mod
      - run: go vet ./...
      - run: go test -short ./...
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOPRIVATE: github.com/endless-net/*
      GONOSUMDB: github.com/endless-net/*
    defaults:
      run:
        working-directory: systemtests
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Configure private modules
        env:
          MODULE_TOKEN: ${{ secrets.ENDLESSNET_MODULE_TOKEN }}
        run: |
          test -n "$MODULE_TOKEN"
          git config --global url."https://x-access-token:${MODULE_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: systemtests/go.mod
      - name: Reject changes to frozen legacy server-release source
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: go run ./cmd/releasecontract verify-history --base "$BASE_SHA" --head "$GITHUB_SHA"
      - run: go mod verify
      - run: go vet ./...
      - run: go test -short ./...
